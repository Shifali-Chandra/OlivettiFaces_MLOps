apiVersion: apps/v1
kind: Deployment
metadata:
  name: olivetti-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: olivetti-app
  template:
    metadata:
      labels:
        app: olivetti-app
    spec:
      containers:
      - name: olivetti-container
        image: shifalichandra/olivetti-face-app:latest
        ports:
        - containerPort: 5000